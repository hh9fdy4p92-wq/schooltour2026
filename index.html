<!doctype html><html><head><meta charset="utf-8"><title>Chicago High School Open Houses</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}#map{position:fixed;inset:0;z-index:1}.topbar{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:900;padding:10px;background:rgba(255,255,255,.97);box-shadow:0 2px 10px #0002}h1{margin:0 0 4px;font-size:18px}.sub{font-size:12px;color:#666;margin-bottom:8px}.controls{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}button,select{border:1px solid #ccc;background:#fff;border-radius:999px;padding:10px 12px;font-size:15px;min-height:42px;white-space:nowrap}button.active{background:#111;color:#fff}select{min-width:175px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:950;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px #0004;max-height:58vh;overflow:auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.25s}.bottom.open{transform:translateY(0)}.closebtn{position:absolute;right:12px;top:10px;border:none;background:#f1f1f1;border-radius:999px;min-height:34px;padding:5px 11px;font-size:18px}.handle{width:44px;height:5px;background:#ccc;border-radius:10px;margin:0 auto 10px}.school-title{font-size:22px;font-weight:850;margin:0;padding-right:42px}.date{font-size:18px;font-weight:800;margin-top:4px}.time{font-size:16px;font-weight:700}.addr{font-size:13px;color:#666;margin:7px 0}.actions{display:flex;gap:8px;margin:10px 0}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;color:#fff;background:#111;border-radius:12px;padding:12px 8px;font-weight:750;font-size:14px;border:none}.actions .secondary{color:#111;background:#f1f1f1}.details{border-top:1px solid #eee;padding:10px 0;font-size:14px}.schedule-title{margin:12px 0 6px;color:#555;font-size:15px}.list{display:none}.list.show{display:block}.list-item{padding:11px 0;border-top:1px solid #eee}.list-item strong{display:block}.marker-label{display:flex;align-items:center;gap:5px;background:#111;color:#fff;border-radius:999px;padding:5px 8px 5px 5px;font-size:11px;font-weight:800;border:2px solid white;box-shadow:0 2px 8px #0004}.marker-num{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-size:12px}@media(min-width:800px){.topbar{left:14px;top:14px;right:auto;width:430px;border-radius:18px}.bottom{left:14px;right:auto;bottom:14px;width:430px;border-radius:22px;max-height:65vh}h1{font-size:22px}}
</style></head><body><div id="map"></div><div class="topbar"><h1>Chicago High School Open Houses</h1><div class="sub">North of Chicago Ave • East of Pulaski • filter by open-house date</div><div class="controls" id="dateControls"><button id="allBtn" class="active" data-date="All" onclick="setDateFilter('All')">All</button><select id="schoolFilter" onchange="render()"><option value="All">All schools</option></select></div></div><div id="bottomSheet" class="bottom"><button class="closebtn" onclick="closeSheet()">×</button><div class="handle"></div><div id="details"></div><div class="schedule-title">Open House Schedule</div><div id="schedule" class="list"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const schools=[{"id": "payton", "school": "Payton College Prep", "address": "1034 N. Wells St., Chicago IL", "lat": 41.9012, "lng": -87.6342, "date": "10/3/2026", "time": "9:00 AM – 1:00 PM", "phone": "773-534-0034", "website": "https://www.wpcp.org", "maps": "https://maps.google.com/?q=1034+N+Wells+St+Chicago+IL", "num": 1}, {"id": "nobleacademy", "school": "Noble Academy", "address": "1443 N. Ogden, Chicago IL", "lat": 41.9076, "lng": -87.6613, "date": "10/3/2026", "time": "11:00 AM – 12:45 PM", "phone": "312-574-1527", "website": "http://thenobleacademy.noblenetwork.org", "maps": "https://maps.google.com/?q=1443+N+Ogden+Chicago+IL", "num": 2}, {"id": "northside", "school": "Northside College Prep", "address": "5501 N. Kedzie, Chicago IL", "lat": 41.9818, "lng": -87.708, "date": "10/4/2026", "time": "10:00 AM – 1:00 PM", "phone": "773-534-3954", "website": "https://www.northsideprep.org", "maps": "https://maps.google.com/?q=5501+N+Kedzie+Chicago+IL", "num": 3}, {"id": "parker", "school": "Francis W. Parker", "address": "330 W. Webster, Chicago IL", "lat": 41.9218, "lng": -87.638, "date": "10/17/2026", "time": "9:30 AM", "phone": "773-353-3000", "website": "https://www.fwparker.org", "maps": "https://maps.google.com/?q=330+W+Webster+Chicago+IL", "num": 4}, {"id": "roosevelt", "school": "Roosevelt", "address": "3436 W. Wilson Ave, Chicago IL", "lat": 41.9648, "lng": -87.714, "date": "10/17/2026", "time": "10:00 AM – 1:00 PM", "phone": "773-534-5000", "website": "https://www.rhsroughriders.org", "maps": "https://maps.google.com/?q=3436+W+Wilson+Ave+Chicago+IL", "num": 5}, {"id": "lincolnpark", "school": "Lincoln Park", "address": "2001 N. Orchard St., Chicago IL", "lat": 41.9183, "lng": -87.6458, "date": "10/17/2026", "time": "1:00 PM – 4:30 PM", "phone": "773-534-8130", "website": "https://www.lincolnparkhs.org", "maps": "https://maps.google.com/?q=2001+N+Orchard+St+Chicago+IL", "num": 6}, {"id": "latin", "school": "Latin School", "address": "59 W. North Blvd, Chicago IL", "lat": 41.9108, "lng": -87.6302, "date": "10/18/2026", "time": "9:00 AM – 11:40 AM OR 12:30 PM – 3:10 PM", "phone": "312-582-6000", "website": "http://www.latinschool.org/admissions/visit-us", "maps": "https://maps.google.com/?q=59+W+North+Blvd+Chicago+IL", "num": 7}, {"id": "senn", "school": "Senn", "address": "5900 N. Glenwood Ave., Chicago IL", "lat": 41.9894, "lng": -87.6654, "date": "10/18/2026", "time": "10:30 AM – 1:00 PM", "phone": "773-534-2365", "website": "https://www.sennhs.org", "maps": "https://maps.google.com/?q=5900+N+Glenwood+Ave+Chicago+IL", "num": 8}, {"id": "von", "school": "Von Steuben", "address": "5039 N. Kimball, Chicago IL", "lat": 41.9732, "lng": -87.7137, "date": "10/24/2026", "time": "8:00 AM – 11:30 AM", "phone": "773-534-5100", "website": "https://www.vonsteuben.org", "maps": "https://maps.google.com/?q=5039+N+Kimball+Chicago+IL", "num": 9}, {"id": "depaul", "school": "DePaul College Prep", "address": "3333 N. Campbell, Chicago IL", "lat": 41.942, "lng": -87.691, "date": "11/1/2026", "time": "12:00 PM – 2:00 PM", "phone": "773-539-3600", "website": "https://www.depaulprep.org", "maps": "https://maps.google.com/?q=3333+N+Campbell+Chicago+IL", "num": 10}, {"id": "amundsen", "school": "Amundsen", "address": "5110 N. Damen Avenue, Chicago IL", "lat": 41.975, "lng": -87.679, "date": "11/7/2026", "time": "9:00 AM – 12:00 PM", "phone": "773-534-2320", "website": "http://amundsenhs.org", "maps": "https://maps.google.com/?q=5110+N+Damen+Ave+Chicago+IL", "num": 11}, {"id": "lane", "school": "Lane Tech", "address": "2501 W. Addison, Chicago IL", "lat": 41.9469, "lng": -87.691, "date": "11/7/2026", "time": "12:00 PM – 3:00 PM", "phone": "773-534-5400", "website": "https://www.lanetech.org", "maps": "https://maps.google.com/?q=2501+W+Addison+Chicago+IL", "num": 12}, {"id": "disney", "school": "Disney II Magnet High School", "address": "3900 N. Lawndale Avenue, Chicago IL", "lat": 41.9527, "lng": -87.72, "date": "11/8/2026", "time": "12:00 PM – 2:00 PM", "phone": "773-534-5010", "website": "https://disneyiimagnet.org", "maps": "https://maps.google.com/?q=3900+N+Lawndale+Ave+Chicago+IL", "num": 13}];let selectedDate="All",selectedId=null,markers=[];const map=L.map('map',{zoomControl:false}).setView([41.947,-87.674],12);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const schoolFilter=document.getElementById("schoolFilter");schools.forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=s.school;schoolFilter.appendChild(o);});
const dateControls=document.getElementById("dateControls");
const uniqueDates=[...new Set(schools.map(s=>s.date))];
const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
uniqueDates.forEach(d=>{
  const parts=d.split("/");
  const b=document.createElement("button");
  b.dataset.date=d;
  b.textContent=monthNames[Number(parts[0])-1]+" "+Number(parts[1]);
  b.onclick=()=>setDateFilter(d);
  dateControls.insertBefore(b,schoolFilter);
});
function visible(s){return(selectedDate==="All"||s.date===selectedDate)&&(schoolFilter.value==="All"||s.id===schoolFilter.value)}function setDateFilter(d){selectedDate=d;document.querySelectorAll("#dateControls button").forEach(b=>b.classList.remove("active"));const btn=document.querySelector(`#dateControls button[data-date="${d}"]`)||document.getElementById("allBtn");btn.classList.add("active");render()}function selectSchool(id,pan=true){selectedId=id;const s=schools.find(x=>x.id===id);if(pan&&s)map.setView([s.lat,s.lng],15);renderDetails();document.getElementById("bottomSheet").classList.add("open")}function closeSheet(){document.getElementById("bottomSheet").classList.remove("open")}function toggleSchedule(){document.getElementById("schedule").classList.toggle("show")}
function renderMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];const b=[];schools.forEach(s=>{if(!visible(s))return;const icon=L.divIcon({className:'',html:`<div class="marker-label"><span class="marker-num">${s.num}</span>${s.school}</div>`,iconSize:null});const m=L.marker([s.lat,s.lng],{icon}).addTo(map);m.on('click',()=>selectSchool(s.id,false));markers.push(m);b.push([s.lat,s.lng]);});if(b.length)map.fitBounds(b,{paddingTopLeft:[30,125],paddingBottomRight:[30,45]})}
function renderDetails(){let s=schools.find(x=>x.id===selectedId);if(!s||!visible(s))s=schools.find(visible);if(!s)return;selectedId=s.id;document.getElementById("details").innerHTML=`<h2 class="school-title">${s.num}. ${s.school}</h2><div class="date">${s.date}</div><div class="time">${s.time}</div><div class="addr">${s.address}</div><div class="actions"><a href="${s.maps}" target="_blank">Directions</a><a class="secondary" href="${s.website}" target="_blank">Website</a><button class="secondary" onclick="toggleSchedule()">Schedule</button></div><div class="details"><strong>Phone:</strong> ${s.phone}</div>`}
function renderSchedule(){const rows=schools.filter(visible);document.getElementById("schedule").innerHTML=rows.map(s=>`<div class="list-item" onclick="selectSchool('${s.id}')"><strong>${s.num}. ${s.school}</strong><div>${s.date} • ${s.time}</div><div class="addr">${s.address}</div></div>`).join("")}function render(){renderMarkers();renderSchedule();if(document.getElementById("bottomSheet").classList.contains("open"))renderDetails()}render();
</script></body></html>
