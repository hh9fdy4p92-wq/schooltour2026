 "10/18/2026", "time": "9:00 AM – 11:40 AM OR 12:30 PM – 3:10 PM", "phone": "312-582-6000", "website": "https://www.latinschool.org/admissions/visit-us", "maps": "https://maps.google.com/?q=59+W+North+Blvd+Chicago+IL", "group": "Private", "type": "Private Independent", "admissions": "Independent private school.", "reg": "REGISTRATION REQUIRED", "regclass": "yes", "regnote": "Latin explicitly says space is limited and registration is required. Registration is through Ravenna and opened September 1.", "num": 7}, {"id": "senn", "school": "Senn", "address": "5900 N. Glenwood Ave., Chicago IL", "lat": 41.9894, "lng": -87.6654, "date": "10/18/2026", "time": "10:30 AM – 1:00 PM", "phone": "773-534-2365", "website": "https://www.sennhs.org", "maps": "https://maps.google.com/?q=5900+N+Glenwood+Ave+Chicago+IL", "group": "Neighborhood / Choice", "type": "CPS Neighborhood + Choice", "admissions": "Neighborhood school with IB and Senn Arts choice programs.", "reg": "NO REQUIREMENT FOUND", "regclass": "unknown", "regnote": "I did not find a current official pre-registration requirement for this Open House. Recheck the school site closer to the event.", "num": 8}, {"id": "von", "school": "Von Steuben", "address": "5039 N. Kimball, Chicago IL", "lat": 41.9732, "lng": -87.7137, "date": "10/24/2026", "time": "8:00 AM – 11:30 AM", "phone": "773-534-5100", "website": "https://www.vonsteuben.org", "maps": "https://maps.google.com/?q=5039+N+Kimball+Chicago+IL", "group": "Magnet / Choice", "type": "CPS Magnet / Scholars", "admissions": "Magnet STEM College Prep plus Scholars program.", "reg": "NO REQUIREMENT FOUND", "regclass": "unknown", "regnote": "I did not find a current official pre-registration requirement for this Open House. Recheck the school site closer to the event.", "num": 9}, {"id": "depaul", "school": "DePaul College Prep", "address": "3333 N. Campbell, Chicago IL", "lat": 41.942, "lng": -87.691, "date": "11/1/2026", "time": "12:00 PM – 2:00 PM", "phone": "773-539-3600", "w , "lat": 41.9527, "lng": -87.72, "date": "11/8/2026", "time": "12:00 PM – 2:00 PM", "phone": "773-534-5010", "website": "https://www.disneyiimagnet.org/apps/pages/index.jsp?type=d&uREC_ID=50178", "maps": "https://maps.google.com/?q=3900+N+Lawndale+Ave+Chicago+IL", "group": "Magnet / Choice", "type": "CPS Magnet", "admissions": "Magnet school emphasizing arts and technology.", "reg": "NO REQUIREMENT FOUND", "regclass": "unknown", "regnote": "Disney II's official enrollment page lists the in-person Open House without a registration instruction. Its smaller school tours are separately limited to 10 participants.", "num": 13}],colors={"Selective Enrollment": "#6f42c1", "Magnet / Choice": "#0077b6", "Neighborhood / Choice": "#2a9d8f", "Charter": "#f4a261", "Private": "#d1495b"};let selectedDate="All",selectedId=null,markers=[];const map=L.map('map',{zoomControl:false}).setView([41.947,-87.674],12);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const schoolFilter=document.getElementById("schoolFilter"),typeFilter=document.getElementById("typeFilter"),dateControls=document.getElementById("dateControls");
schools.forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=s.school;schoolFilter.appendChild(o);});
Object.keys(colors).forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;typeFilter.appendChild(o);});

const mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];[...new Set(schools.map(s=>s.date))].forEach(d=>{const p=d.split("/"),b=document.createElement("button");b.dataset.date=d;b.textContent=mn[+p[0]-1]+" "+(+p[1]);b.onclick=()=>setDateFilter(d);dateControls.insertBefore(b,schoolFilter);});
function visible(s){return(selectedDate==="All"||s.date===selectedDate)&&(schoolFilter.value==="All"||s.id===schoolFilter.value)&&(typeFilter.value==="All"||s.group===typeFilter.value)}function setDateFilter(d){selectedDate=d;document.querySelectorAll("#dateControls button").forEach(b=>b.classList.remove("active"));(document.querySelector(`#dateControls button[data-date="${d}"]`)||document.getElementById("allBtn")).classList.add("active");render()}function selectSchool(id,pan=true){selectedId=id;const s=schools.find(x=>x.id===id);if(pan&&s)map.setView([s.lat,s.lng],15);renderDetails();document.getElementById("bottomSheet").classList.add("open")}function closeSheet(){document.getElementById("bottomSheet").classList.remove("open")}function toggleSchedule(){document.getElementById("schedule").classList.toggle("show")}
function renderMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];const b=[];schools.forEach(s=>{if(!visible(s))return;const c=colors[s.group],icon=L.divIcon({className:'',html:`<div class="marker-label" style="background:${c}"><span class="marker-num">${s.num}</span>${s.school}</div>`,iconSize:null});const m=L.marker([s.lat,s.lng],{icon}).addTo(map);m.on('click',()=>selectSchool(s.id,false));markers.push(m);b.push([s.lat,s.lng]);});if(b.length)map.fitBounds(b,{paddingTopLeft:[30,175],paddingBottomRight:[30,45]})}
function renderDetails(){let s=schools.find(x=>x.id===selectedId);if(!s||!visible(s))s=schools.find(visible);if(!s)return;selectedId=s.id;document.getElementById("details").innerHTML=`<h2 class="school-title">${s.num}. ${s.school}</h2><div class="typebadge" style="background:${colors[s.group]}">${s.type}</div><div class="regbadge ${s.regclass}">${s.reg}</div><div class="date">${s.date}</div><div class="time">${s.time}</div><div class="addr">${s.address}</div><div class="actions"><a href="${s.maps}" target="_blank">Directions</a><a class="secondary" href="${s.website}" target="_blank">School / Event Page</a><button class="secondary" onclick="toggleSchedule()">Schedule</button></div><div class="details"><strong>Open-house registration:</strong><br>${s.regnote}</div><div class="details"><strong>School type:</strong><br>${s.admissions}</div><div class="details"><strong>Phone:</strong> ${s.phone}</div>`}
function renderSchedule(){document.getElementById("schedule").innerHTML=schools.filter(visible).map(s=>`<div class="list-item" onclick="selectSchool('${s.id}')"><strong>${s.num}. ${s.school}</strong><div class="mini-type" style="color:${colors[s.group]}">${s.type} • ${s.reg}</div><div>${s.date} • ${s.time}</div></div>`).join("")}function render(){renderMarkers();renderSchedule();if(document.getElementById("bottomSheet").classList.contains("open"))renderDetails()}render();
