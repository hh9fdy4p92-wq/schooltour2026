const type=document.getElementById("type"),school=document.getElementById("school"),dates=document.getElementById("dates"),sheet=document.getElementById("sheet");
Object.keys(colors).forEach(g=>{let o=document.createElement("option");o.value=g;o.textContent=g;type.appendChild(o)});
[...schools].sort((a,b)=>a.school.localeCompare(b.school)).forEach(s=>{let o=document.createElement("option");o.value=s.id;o.textContent=s.school;school.appendChild(o)});
document.getElementById("legend").innerHTML=Object.entries(colors).map(([k,v])=>`<span><i class="dot" style="background:${v}"></i>${k}</span>`).join("");
const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
[...new Set(schools.map(s=>s.date))].forEach(d=>{let b=document.createElement("button");b.dataset.date=d;b.textContent=d==="TBD"?"Date TBD":months[+d.split("/")[0]-1]+" "+(+d.split("/")[1]);b.onclick=()=>setDate(d);dates.insertBefore(b,type)});
function setDate(d){chosenDate=d;document.querySelectorAll("#dates button").forEach(b=>b.classList.toggle("active",b.dataset.date===d));render()}
function visible(s){return (chosenDate==="All"||s.date===chosenDate)&&(type.value==="All"||s.group===type.value)&&(school.value==="All"||s.id===school.value)}
function show(id){const s=schools.find(x=>x.id===id);let phone=s.phone?`<div class="note"><b>Phone:</b> ${s.phone}</div>`:"";let rank=s.niche_grade?`<div class="rankbox"><div><b>2026 Niche Overall Grade:</b> <span class="rankgrade">${s.niche_grade}</span></div>${s.niche_rank?`<div>${s.niche_rank}</div>`:""}<div style="font-size:11px;color:#666;margin-top:3px">Category rankings are not directly comparable across public, private, arts and Standout lists.</div></div>`:`<div class="rankbox"><b>2026 Niche:</b> ranking not yet verified for this map.</div>`;document.getElementById("detail").innerHTML=`<h2 class="title">${s.num}. ${s.school}</h2><span class="badge" style="background:${colors[s.group]}">${s.type}</span>${rank}<div class="date">${s.date==="TBD"?"Open house: TBD":s.date}</div><div class="time">${s.time}</div><div class="addr">${s.address}</div><div class="actions"><a target="_blank" href="${s.maps}">Directions</a><a class="alt" target="_blank" href="${s.website}">School / Admissions</a></div><div class="note">${s.note}</div>${phone}`;sheet.classList.add("open")}
function render(){markers.forEach(m=>map.removeLayer(m));markers=[];let bounds=[];schools.filter(visible).forEach(s=>{let c=colors[s.group],icon=L.divIcon({className:"",html:`<div class="marker" style="background:${c}"><span class="n">${s.num}</span>${s.school}</div>`,iconSize:null});let m=L.marker([s.lat,s.lng],{icon}).addTo(map);m.on("click",()=>show(s.id));markers.push(m);bounds.push([s.lat,s.lng])});if(bounds.length)map.fitBounds(bounds,{paddingTopLeft:[25,180],paddingBottomRight:[25,50]})}render();
</script></body></html>
